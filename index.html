<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bijouterie Thiam Gold | Bijoux en Or — Dakar</title>
<meta name="description" content="Bijouterie Thiam Gold — Bijoux en or authentiques à Dakar. Bagues, colliers, bracelets, boucles d'oreilles. Pikine Rue 10." />
<link rel="icon" type="image/jpeg" href="images/Logo.jpeg">
<link rel="apple-touch-icon" href="images/Logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #faf6ef;
    --cream2: #f3ead8;
    --gold: #b8952a;
    --gold-light: #d4af50;
    --gold-pale: #f0e4b8;
    --dark: #1a1610;
    --dark2: #2c2518;
    --text: #3a3020;
    --muted: #7a7060;
    --line: #e2d5bb;
    --white: #ffffff;
    --font-serif: 'Playfair Display', Georgia, serif;
    --font-sans: 'Jost', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; display: block; }
  a { text-decoration: none; color: inherit; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--cream2); }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shimmer {
    0%, 100% { opacity: .4; }
    50% { opacity: 1; }
  }
  @keyframes rotateSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes slideIn {
    from { transform: translateX(-100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(184,149,42,.4); }
    50% { box-shadow: 0 0 0 12px rgba(184,149,42,0); }
  }

  .animate-up { animation: fadeUp .7s ease both; }
  .delay-1 { animation-delay: .1s; }
  .delay-2 { animation-delay: .2s; }
  .delay-3 { animation-delay: .3s; }
  .delay-4 { animation-delay: .45s; }

  /* ORNAMENT DIVIDER */
  .ornament {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 auto 2.5rem;
    max-width: 240px;
    color: var(--gold);
    font-size: .75rem;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .ornament::before, .ornament::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* HEADER */
  .header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(250,246,239,.95);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 1280px;
    margin: auto;
    padding: 0 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
    gap: 1rem;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: .75rem;
    cursor: pointer;
  }
  .brand-icon {
    width: 44px; height: 44px;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: var(--font-serif);
    font-size: 1.1rem;
    color: var(--gold);
    font-weight: 700;
    background: linear-gradient(135deg, #fff8e8, #fdf4e2);
  }
  .brand-logo {
  width: 44px;
  height: 44px;
  object-fit: cover;
  border-radius: 50%;
  border: 1.5px solid var(--gold);
  background: white;
  }
  .brand-name {
    font-family: var(--font-serif);
    font-size: 1.15rem;
    color: var(--dark);
    line-height: 1.1;
  }
  .brand-sub {
    font-size: .68rem;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 500;
    margin-top: 2px;
  }
  .nav-links {
    display: flex;
    list-style: none;
    gap: .2rem;
    align-items: center;
  }
  .nav-links a {
    padding: .6rem .9rem;
    border-radius: 8px;
    font-size: .88rem;
    font-weight: 500;
    color: var(--muted);
    transition: .2s;
    letter-spacing: .3px;
  }
  .nav-links a:hover, .nav-links a.active {
    color: var(--dark);
    background: var(--cream2);
  }
  .nav-actions { display: flex; gap: .5rem; align-items: center; }
  .btn {
    border: none;
    cursor: pointer;
    font-family: var(--font-sans);
    font-weight: 600;
    border-radius: 8px;
    padding: .65rem 1.1rem;
    font-size: .85rem;
    transition: all .2s ease;
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    white-space: nowrap;
    letter-spacing: .4px;
  }
  .btn-gold {
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: var(--dark);
    box-shadow: 0 4px 16px rgba(184,149,42,.25);
  }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(184,149,42,.3); }
  .btn-outline {
    background: transparent;
    color: var(--dark);
    border: 1.5px solid var(--line);
  }
  .btn-outline:hover { background: var(--cream2); border-color: var(--gold-light); transform: translateY(-1px); }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    font-size: .82rem;
    padding: .5rem .7rem;
  }
  .btn-ghost:hover { color: var(--dark); }
  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: 1px solid var(--line);
    padding: .5rem .65rem;
    border-radius: 8px;
    cursor: pointer;
  }
  .hamburger span {
    width: 20px;
    height: 1.5px;
    background: var(--dark);
    transition: .2s;
    display: block;
  }

  /* MOBILE MENU */
  .mobile-menu {
    position: fixed;
    top: 72px;
    left: 0; right: 0;
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding: 1rem 5%;
    z-index: 999;
    animation: slideIn .25s ease;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  .mobile-menu ul { list-style: none; }
  .mobile-menu li a {
    display: block;
    padding: .85rem 0;
    border-bottom: 1px solid var(--line);
    font-size: .95rem;
    font-weight: 500;
    color: var(--dark);
  }
  .mobile-menu .m-actions {
    display: flex;
    gap: .65rem;
    margin-top: 1rem;
  }

  /* HERO */
  .hero {
    padding: 2.5rem 5% 3.5rem;
    max-width: 1280px;
    margin: auto;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    align-items: stretch;
  }
  .hero-left {
    background: linear-gradient(145deg, #fffbf2, #faf4e2);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 2.5rem;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 500px;
  }
  .hero-left::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 280px; height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,149,42,.1), transparent 65%);
    pointer-events: none;
  }
  .hero-left::after {
    content: '◆';
    position: absolute;
    bottom: 30px; right: 30px;
    font-size: 6rem;
    color: rgba(184,149,42,.06);
    pointer-events: none;
    line-height: 1;
  }
  .hero-kicker {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    padding: .35rem .8rem;
    background: var(--gold-pale);
    border: 1px solid #d4b86a;
    border-radius: 999px;
    color: var(--gold);
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 1.25rem;
    width: fit-content;
  }
  .hero-title {
    font-family: var(--font-serif);
    font-size: clamp(2rem, 4vw, 3.2rem);
    line-height: 1.06;
    color: var(--dark);
    margin-bottom: .9rem;
  }
  .hero-title em {
    font-style: italic;
    color: var(--gold);
  }
  .hero-desc {
    color: var(--muted);
    font-size: .95rem;
    max-width: 50ch;
    line-height: 1.7;
    margin-bottom: 1.5rem;
    font-weight: 300;
  }
  .hero-btns {
    display: flex;
    flex-wrap: wrap;
    gap: .65rem;
    margin-bottom: 1.75rem;
  }
  .hero-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .65rem;
  }
  .stat-box {
    background: rgba(255,255,255,.75);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: .8rem .75rem;
  }
  .stat-box strong {
    display: block;
    font-size: .9rem;
    color: var(--dark);
    margin-bottom: 2px;
    font-weight: 600;
  }
  .stat-box span {
    font-size: .76rem;
    color: var(--muted);
    font-weight: 400;
  }

  /* SLIDER */
  .hero-slider {
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--line);
    background: var(--dark2);
    min-height: 500px;
  }
  .slide-img {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity .8s ease;
  }
  .slide-img.active { opacity: 1; }
  .slide-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(15,11,5,.75) 0%, rgba(15,11,5,.1) 55%, transparent 100%);
  }
  .slide-caption {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 1.5rem;
    z-index: 2;
  }
  .slide-caption h3 {
    font-family: var(--font-serif);
    font-size: 1.4rem;
    color: var(--white);
    margin-bottom: .3rem;
  }
  .slide-caption p {
    color: rgba(255,255,255,.75);
    font-size: .88rem;
    font-weight: 300;
  }
  .slide-controls {
    position: absolute;
    top: 50%; left: 0; right: 0;
    transform: translateY(-50%);
    display: flex;
    justify-content: space-between;
    padding: 0 12px;
    z-index: 3;
    pointer-events: none;
  }
  .slide-btn {
    pointer-events: auto;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.3);
    color: white;
    font-size: 1.1rem;
    cursor: pointer;
    backdrop-filter: blur(4px);
    display: grid;
    place-items: center;
    transition: .2s;
  }
  .slide-btn:hover { background: rgba(255,255,255,.3); }
  .slide-dots {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 4;
  }
  .sdot {
    width: 8px; height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.4);
    border: none;
    cursor: pointer;
    transition: .25s;
  }
  .sdot.active { width: 22px; background: var(--gold-light); }

  /* MARQUEE BAND */
  .marquee-band {
    background: var(--dark);
    color: var(--gold-light);
    overflow: hidden;
    padding: .65rem 0;
    font-size: .8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .marquee-inner {
    display: flex;
    gap: 3rem;
    white-space: nowrap;
    animation: marqueeScroll 22s linear infinite;
  }
  @keyframes marqueeScroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .marquee-inner span { flex-shrink: 0; }
  .marquee-sep { color: rgba(255,255,255,.25); }

  /* CATEGORY STRIP */
  .cat-section {
    padding: 3rem 5%;
    max-width: 1280px;
    margin: auto;
  }
  .section-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }
  .section-label {
    font-size: .72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: .6rem;
  }
  .section-title {
    font-family: var(--font-serif);
    font-size: clamp(1.6rem, 3vw, 2.6rem);
    color: var(--dark);
    line-height: 1.1;
  }
  .section-sub {
    color: var(--muted);
    margin-top: .6rem;
    font-size: .9rem;
    font-weight: 300;
  }
  .cat-strip {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .cat-pill {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .6rem 1.2rem;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--white);
    cursor: pointer;
    font-size: .85rem;
    font-weight: 500;
    color: var(--muted);
    transition: .2s;
    letter-spacing: .2px;
  }
  .cat-pill:hover, .cat-pill.active {
    background: var(--gold-pale);
    border-color: var(--gold-light);
    color: var(--dark);
  }
  .cat-pill span { font-size: .95rem; }

  /* PRODUCTS */
  .products-section {
    padding: 0 5% 4rem;
    max-width: 1280px;
    margin: auto;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
    gap: .75rem;
  }
  .price-badge {
    background: var(--gold-pale);
    border: 1px solid #d4b86a;
    color: var(--gold);
    padding: .38rem .8rem;
    border-radius: 999px;
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .5px;
  }
  .products-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.1rem;
  }
  .product-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .product-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(0,0,0,.07);
  }
  .product-thumb {
    aspect-ratio: 1/1;
    background-size: cover;
    background-position: center;
    position: relative;
    background-color: #f3ead8;
  }
  .product-badge {
    position: absolute;
    top: 10px; left: 10px;
    background: rgba(255,255,255,.92);
    border: 1px solid var(--line);
    color: var(--gold);
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: .22rem .55rem;
    border-radius: 999px;
  }
  .product-wa-btn {
    position: absolute;
    bottom: 10px; right: 10px;
    background: #25d366;
    border: none;
    border-radius: 50%;
    width: 36px; height: 36px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: .2s;
    opacity: 0;
    transform: scale(.8);
    box-shadow: 0 4px 12px rgba(37,211,102,.35);
  }
  .product-card:hover .product-wa-btn {
    opacity: 1;
    transform: scale(1);
  }
  .product-wa-btn svg { width: 18px; height: 18px; }
  .product-body { padding: 1rem; }
  .product-name {
    font-family: var(--font-serif);
    font-size: 1rem;
    color: var(--dark);
    margin-bottom: .25rem;
    line-height: 1.3;
  }
  .product-desc {
    font-size: .82rem;
    color: var(--muted);
    margin-bottom: .75rem;
    font-weight: 300;
    min-height: 38px;
  }
  .product-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: .4rem;
  }
  .product-price {
    font-weight: 700;
    color: var(--dark);
    font-size: .9rem;
    line-height: 1.2;
  }
  .product-price small {
    display: block;
    font-weight: 400;
    color: var(--muted);
    font-size: .72rem;
  }
  .product-tag {
    font-size: .72rem;
    color: var(--gold);
    background: var(--gold-pale);
    border: 1px solid #d4b86a;
    padding: .2rem .5rem;
    border-radius: 999px;
    flex-shrink: 0;
  }

  /* WHY US */
  .why-section {
    background: var(--dark);
    padding: 3.5rem 5%;
    position: relative;
    overflow: hidden;
  }
  .why-section::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,149,42,.08), transparent 65%);
    pointer-events: none;
  }
  .why-inner {
    max-width: 1280px;
    margin: auto;
  }
  .why-title {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 3vw, 2.4rem);
    color: var(--white);
    text-align: center;
    margin-bottom: .4rem;
  }
  .why-sub {
    text-align: center;
    color: rgba(255,255,255,.45);
    font-size: .88rem;
    margin-bottom: 2.5rem;
    font-weight: 300;
  }
  .why-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
  }
  .why-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 1.5rem 1.2rem;
    text-align: center;
    transition: .25s;
  }
  .why-card:hover {
    background: rgba(184,149,42,.08);
    border-color: rgba(184,149,42,.25);
  }
  .why-icon {
    font-size: 1.8rem;
    margin-bottom: .75rem;
  }
  .why-card h4 {
    font-family: var(--font-serif);
    font-size: 1.05rem;
    color: var(--white);
    margin-bottom: .4rem;
  }
  .why-card p {
    font-size: .82rem;
    color: rgba(255,255,255,.45);
    font-weight: 300;
    line-height: 1.6;
  }

  /* CONTACT */
  .contact-section {
    padding: 4rem 5%;
    max-width: 1280px;
    margin: auto;
  }
  .contact-grid {
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 1.5rem;
  }
  .contact-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 8px 30px rgba(0,0,0,.04);
  }
  .contact-card h3 {
    font-family: var(--font-serif);
    font-size: 1.5rem;
    color: var(--dark);
    margin-bottom: .4rem;
  }
  .contact-card > p {
    color: var(--muted);
    font-size: .88rem;
    margin-bottom: 1.25rem;
    font-weight: 300;
  }
  .contact-items { display: grid; gap: .55rem; margin-bottom: 1.25rem; }
  .contact-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .75rem 1rem;
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .contact-row span { font-size: .82rem; color: var(--muted); }
  .contact-row a {
    font-weight: 700;
    color: var(--dark);
    font-size: .9rem;
    transition: .15s;
  }
  .contact-row a:hover { color: var(--gold); }
  .contact-actions { display: flex; gap: .65rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .wa-main-btn {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    background: #25d366;
    color: white;
    font-weight: 700;
    font-family: var(--font-sans);
    padding: .75rem 1.25rem;
    border-radius: 10px;
    font-size: .9rem;
    transition: .2s;
    border: none;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 4px 16px rgba(37,211,102,.25);
    animation: pulse 2.5s ease infinite;
  }
  .wa-main-btn:hover { transform: translateY(-2px); background: #20ba5a; }
  .map-placeholder {
    background: var(--cream2);
    border: 1px solid var(--line);
    border-radius: 12px;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    color: var(--muted);
    font-size: .88rem;
    text-align: center;
    padding: 1rem;
  }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// DATA
const heroSlides = [
  { image: "images/1.jpeg", fallback: "https://images.unsplash.com/photo-1535632787350-4e68ef0ac584?w=900&q=80", title: "Collection Élégance", text: "Des bijoux raffinés pour vos occasions spéciales." },
  { image: "images/2.jpeg", fallback: "https://images.unsplash.com/photo-1617038260897-41a1f14a8ca0?w=900&q=80", title: "Or Authentique", text: "Des pièces mises en valeur dans un cadre chic." },
  { image: "images/3.jpeg", fallback: "https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=900&q=80", title: "Style & Raffinement", text: "Des créations pour sublimer votre allure." },
];

const categories = [
  { key: "all", label: "Tous les bijoux", icon: "✦" },
  { key: "bague", label: "Bagues", icon: "💍" },
  { key: "collier", label: "Colliers", icon: "📿" },
  { key: "bracelet", label: "Bracelets", icon: "⌚" },
  { key: "boucles", label: "Boucles d'oreilles", icon: "✨" },
];

const products = [
  { id:1, cat:"bague",    name:"Bague classique en or",   desc:"Modèle élégant pour usage quotidien ou cérémonie.",        price:"",    note:"Selon poids",    badge:"Bague",    img:"images/4.jpeg",  fb:"https://images.unsplash.com/photo-1629224316810-9d8805b95e76?w=600&q=80" },
  { id:2, cat:"collier",  name:"Collier chaîne fine",     desc:"Chaîne en or brillante, finition moderne et légère.",       price:"",    note:"Selon longueur", badge:"Collier",   img:"images/5.jpeg",  fb:"https://images.unsplash.com/photo-1611652022419-a9419f74343d?w=600&q=80" },
  { id:3, cat:"bracelet", name:"Bracelet en or",          desc:"Bracelet chic pour femme ou homme, finition soignée.",      price:"",    note:"Prix variable",  badge:"Bracelet", img:"images/6.jpeg",  fb:"https://images.unsplash.com/photo-1588444837495-c6cfeb53f32d?w=600&q=80" },
  { id:4, cat:"boucles",  name:"Boucles d'oreilles",      desc:"Design raffiné, finitions impeccables pour toute occasion.", price:"",     note:"Selon modèle",   badge:"Boucles",  img:"images/7.jpeg",  fb:"https://images.unsplash.com/photo-1535632787350-4e68ef0ac584?w=600&q=80" },
  { id:5, cat:"bague",    name:"Bague premium",           desc:"Modèle travaillé avec finition haut de gamme.",              price:"",    note:"Poids & design", badge:"Bague",    img:"images/8.jpeg",  fb:"https://images.unsplash.com/photo-1615655096345-61a54750068d?w=600&q=80" },
  { id:6, cat:"collier",  name:"Collier pendentif",       desc:"Collier élégant pour un style distingué et unique.",        price:"",   note:"Selon pendentif",badge:"Collier",  img:"images/9.jpeg",  fb:"https://images.unsplash.com/photo-1574634534894-89d7576c8259?w=600&q=80" },
  { id:7, cat:"bracelet", name:"Bracelet gourmette",      desc:"Style intemporel, mailles brillantes et solides.",           price:"",    note:"Selon grammage", badge:"Bracelet", img:"images/10.jpeg", fb:"https://images.unsplash.com/photo-1582213782179-e0d53f98f2ca?w=600&q=80" },
  { id:8, cat:"boucles",  name:"Boucles tendance",        desc:"Modèle moderne pour toutes les occasions festives.",         price:"",   note:"Selon finition", badge:"Boucles",  img:"images/11.jpeg", fb:"https://images.unsplash.com/photo-1599643477877-530eb83abc8e?w=600&q=80" },
];

const WA_NUMBER = "221786064030";
const waLink = (msg = "Bonjour Bijouterie Thiam Gold, je souhaite avoir des informations sur vos bijoux.") =>
  `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;

// CART CONTEXT
const CartContext = React.createContext();
function CartProvider({ children }) {
  const [cart, setCart] = useState([]);
  const addItem = (product) => {
    setCart(prev => {
      const exists = prev.find(i => i.id === product.id);
      if (exists) return prev.map(i => i.id === product.id ? {...i, qty: i.qty+1} : i);
      return [...prev, {...product, qty:1}];
    });
  };
  const removeItem = (id) => setCart(prev => prev.filter(i => i.id !== id));
  const changeQty = (id, delta) => setCart(prev =>
    prev.map(i => i.id === id ? {...i, qty: Math.max(1, i.qty+delta)} : i)
  );
  const clearCart = () => setCart([]);
  const total = cart.reduce((s,i) => s + i.qty, 0);
  return (
    <CartContext.Provider value={{cart, addItem, removeItem, changeQty, clearCart, total}}>
      {children}
    </CartContext.Provider>
  );
}

// CART ICON SVG
function CartIcon({ size=20 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 001.98 1.61H19a2 2 0 001.98-1.71l1.54-8.29H5.12"/>
    </svg>
  );
}

// CART DRAWER
function CartDrawer({ onClose }) {
  const { cart, removeItem, changeQty, clearCart } = React.useContext(CartContext);
  const [bgs, setBgs] = useState({});

  useEffect(() => {
    cart.forEach(item => {
      if (bgs[item.id]) return;
      const img = new Image();
      img.onerror = () => setBgs(prev => ({...prev, [item.id]: item.fb}));
      img.src = item.img;
      if (!bgs[item.id]) setBgs(prev => ({...prev, [item.id]: item.img}));
    });
  }, [cart]);

  const sendToWhatsApp = () => {
    if (cart.length === 0) return;
    const lines = cart.map(i => `• ${i.name} (x${i.qty}) — ${i.price}`).join('\n');
    const msg = `Bonjour Bijouterie Thiam Gold 👋\n\n🛒 *Ma commande :*\n${lines}\n\nMerci de me confirmer la disponibilité et le prix exact.`;
    window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
  };

  return (
    <>
      <div className="cart-overlay" onClick={onClose}/>
      <div className="cart-drawer">
        <div className="cart-header">
          <div>
            <h2>Mon Panier</h2>
            <span>{cart.length === 0 ? 'Panier vide' : `${cart.reduce((s,i)=>s+i.qty,0)} article${cart.reduce((s,i)=>s+i.qty,0)>1?'s':''}`}</span>
          </div>
          <button className="cart-close" onClick={onClose}>✕</button>
        </div>

        <div className="cart-body">
          {cart.length === 0 ? (
            <div className="cart-empty">
              <div className="cart-empty-icon">🛒</div>
              <strong style={{color:'var(--dark)'}}>Votre panier est vide</strong>
              <p style={{fontSize:'.82rem'}}>Ajoutez des bijoux depuis la collection</p>
              <button className="btn btn-gold" style={{marginTop:'.5rem'}} onClick={onClose}>Voir la collection</button>
            </div>
          ) : cart.map(item => (
            <div className="cart-item" key={item.id}>
              <div className="cart-item-img" style={{backgroundImage:`url('${bgs[item.id] || item.fb}')`}}/>
              <div className="cart-item-info">
                <div className="cart-item-name">{item.name}</div>
                <div className="cart-item-price">{item.price}</div>
                <div className="cart-item-qty">
                  <button className="qty-btn" onClick={() => changeQty(item.id,-1)}>−</button>
                  <span className="qty-num">{item.qty}</span>
                  <button className="qty-btn" onClick={() => changeQty(item.id,+1)}>+</button>
                </div>
              </div>
              <button className="cart-item-remove" onClick={() => removeItem(item.id)} title="Retirer">✕</button>
            </div>
          ))}
        </div>

        {cart.length > 0 && (
          <div className="cart-footer">
            <div className="cart-note">
              💡 Les prix sont indicatifs. Après validation, WhatsApp recevra votre commande pour confirmation du prix exact.

// HERO SLIDER
function HeroSlider() {
  const [cur, setCur] = useState(0);
  const [bgs, setBgs] = useState(heroSlides.map(s => s.image));
  const timerRef = useRef(null);

  useEffect(() => {
    heroSlides.forEach((s, i) => {
      const img = new Image();
      img.onerror = () => setBgs(prev => { const n=[...prev]; n[i]=s.fallback; return n; });
      img.src = s.image;
    });
  }, []);

  useEffect(() => {
    timerRef.current = setInterval(() => setCur(c => (c+1) % heroSlides.length), 4500);
    return () => clearInterval(timerRef.current);
  }, []);

  const go = (idx) => {
    clearInterval(timerRef.current);
    setCur((idx + heroSlides.length) % heroSlides.length);
    timerRef.current = setInterval(() => setCur(c => (c+1) % heroSlides.length), 4500);
  };

  return (
    <div className="hero-slider">
      {heroSlides.map((s, i) => (
        <div key={i} className={`slide-img${i===cur?' active':''}`}
             style={{ backgroundImage:`url('${bgs[i]}')` }}>
          <div className="slide-overlay"/>
        </div>
      ))}
      <div className="slide-caption">
        <h3>{heroSlides[cur].title}</h3>
        <p>{heroSlides[cur].text}</p>
      </div>
      <div className="slide-controls">
        <button className="slide-btn" onClick={() => go(cur-1)}>‹</button>
        <button className="slide-btn" onClick={() => go(cur+1)}>›</button>
      </div>
      <div className="slide-dots">
        {heroSlides.map((_, i) => (
          <button key={i} className={`sdot${i===cur?' active':''}`} onClick={() => go(i)}/>
        ))}
      </div>
    </div>
  );
}

// PRODUCT CARD
function ProductCard({ item }) {
  const { addItem } = React.useContext(CartContext);
  const [bg, setBg] = useState(item.img);
  const [added, setAdded] = useState(false);

  useEffect(() => {
    const img = new Image();
    img.onerror = () => setBg(item.fb);
    img.src = item.img;
  }, [item]);

  const handleAdd = () => {
    addItem(item);
    setAdded(true);
    setTimeout(() => setAdded(false), 1500);
  };

  const msg = `Bonjour Bijouterie Thiam Gold, je suis intéressé(e) par : ${item.name}. Pourriez-vous me donner plus d'informations et le prix exact ?`;

  return (
    <article className="product-card animate-up">
      <div className="product-thumb" style={{ backgroundImage:`url('${bg}')` }}>
        <span className="product-badge">{item.badge}</span>
        <a href={waLink(msg)} target="_blank" rel="noopener" className="product-wa-btn" aria-label="Commander sur WhatsApp">
          <WaIcon/>
        </a>
      </div>
      <div className="product-body">
        <h3 className="product-name">{item.name}</h3>
        <p className="product-desc">{item.desc}</p>
        <div className="product-footer">
          <div className="product-price">
            {item.price}
            <small>{item.note}</small>
          </div>
          <span className="product-tag">Variable</span>
        </div>
        <button className={`add-cart-btn${added?' added':''}`} onClick={handleAdd}>
          {added ? '✓ Ajouté !' : <><CartIcon size={14}/> Ajouter au panier</>}
        </button>
      </div>
    </article>
  );
}

// CONTACT FORM
function ContactForm() {
  const [form, setForm] = useState({ nom:'', tel:'', produit:'', msg:'' });
  const [sent, setSent] = useState(false);

  const update = (k, v) => setForm(f => ({...f, [k]:v}));

  const handleSubmit = (e) => {
    e.preventDefault();
    const text = `Bonjour Bijouterie Thiam Gold 👋\n\nNom : ${form.nom}\nTéléphone : ${form.tel}\nProduit : ${form.produit || 'Non précisé'}\nMessage : ${form.msg}`;
    window.open(waLink(text), '_blank');
    setSent(true);
    setTimeout(() => setSent(false), 3500);
    setForm({ nom:'', tel:'', produit:'', msg:'' });
  };

  return (
    <form className="contact-form" onSubmit={handleSubmit}>
      <input className="form-input" placeholder="Votre nom *" required value={form.nom} onChange={e=>update('nom',e.target.value)}/>
      <input className="form-input" type="tel" placeholder="Votre numéro de téléphone *" required value={form.tel} onChange={e=>update('tel',e.target.value)}/>
      <input className="form-input" placeholder="Produit souhaité (ex : bague, collier…)" value={form.produit} onChange={e=>update('produit',e.target.value)}/>
      <textarea className="form-textarea" placeholder="Votre message…" required value={form.msg} onChange={e=>update('msg',e.target.value)}/>
      <button type="submit" className="btn btn-gold" style={{justifyContent:'center', padding:'.72rem 1.2rem', fontSize:'.88rem'}}>
        <WaIcon size={16}/> Envoyer via WhatsApp
      </button>
      {sent && <p style={{color:'#25d366', fontSize:'.82rem', textAlign:'center'}}>✓ Message envoyé sur WhatsApp !</p>}
      <p className="form-note">Votre message sera envoyé directement sur WhatsApp au +221 78 606 40 30</p>
    </form>
  );
}
